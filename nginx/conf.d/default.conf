server {
    listen 80;
    server_name eeffs.com www.eeffs.com; # Tu nuevo dominio

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri; # Redirige todo a HTTPS
    }
}

